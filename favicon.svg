<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bgGrad)"/>
  
  <!-- Outer Orbit Rings (Science & Physics) -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85" transform="rotate(-30 64 64)"/>
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85" transform="rotate(30 64 64)"/>

  <!-- Glowing Orbiting Particles -->
  <circle cx="27" cy="42" r="5.5" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="101" cy="42" r="5.5" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="64" cy="18" r="4.5" fill="#ffffff" filter="url(#glow)"/>

  <!-- Center White Shield Badge -->
  <circle cx="64" cy="66" r="26" fill="#ffffff" filter="url(#glow)"/>

  <!-- Vibrant Sprout / Leaf & Flask (Biology & Life) -->
  <path d="M64 78 C 64 58, 49 50, 49 50 C 49 50, 62 50, 64 63 C 66 50, 79 50, 79 50 C 79 50, 64 58, 64 78 Z" fill="url(#leafGrad)"/>
  <path d="M64 64 L64 80" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>

  <!-- Academic Cap Top (Education & BioTa'lim) -->
  <polygon points="64,22 86,32 64,42 42,32" fill="#fbbf24"/>
  <polygon points="64,42 64,46 76,40 76,36" fill="#d97706"/>
  <path d="M80 34 L88 44" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
</svg>
